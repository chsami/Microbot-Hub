// gradle/plugin-utils.gradle
// Common utilities and functions for plugin processing

import java.security.MessageDigest

ext {
    // Common plugin discovery and validation
    discoverPlugins = { pluginsDir ->
        def pluginDirs = pluginsDir.listFiles()?.findAll { it.isDirectory() } ?: []
        def validPlugins = []

        pluginDirs.each { pluginDir ->
            def pluginJavaFile = pluginDir.listFiles()?.find { file ->
                file.name.endsWith("Plugin.java")
            }

            if (pluginJavaFile) {
                validPlugins << [
                    dir: pluginDir,
                    javaFile: pluginJavaFile,
                    name: pluginJavaFile.name - '.java',
                    sourceSetName: pluginDir.name
                ]
            } else {
                logger.warn("⚠️ No Plugin.java file found in ${pluginDir.name}")
            }
        }

        return validPlugins
    }

    // Optional per-plugin shared source globs (paths relative to src/main/java, one per line, '#' for
    // comments) declared in the plugin's resources/<plugin>/shared-sources.txt. Lets a plugin pull in
    // shared framework packages that live outside its own directory, for BOTH compilation and JAR
    // bundling — mirroring the per-plugin dependencies.txt opt-in. Only plugins that declare it are
    // affected, so nothing is added to other plugins' source sets or JARs.
    getPluginSharedSources = { plugin ->
        def sharedFile = new File(project.rootDir,
            "${project.ext.getPluginsResourcePath()}/${plugin.dir.name}/shared-sources.txt")
        if (!sharedFile.exists()) {
            return []
        }
        return sharedFile.readLines()
            .collect { it.trim() }
            .findAll { it && !it.startsWith("#") }
    }

    // Common source set configuration
    configurePluginSourceSet = { plugin ->
        def sharedSources = project.ext.getPluginSharedSources(plugin)
        sourceSets {
            "${plugin.sourceSetName}" {
                java {
                    srcDirs = ["src/main/java"]
                    include "${project.ext.getPluginsIncludePath()}/PluginConstants.java"
                    include "${project.ext.getPluginsIncludePath()}/Rs2Leprechaun.java"
                    include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"
                    sharedSources.each { glob -> include glob }
                }
                resources {
                    srcDirs = ["src/main/resources"]
                    include "${project.ext.getPluginsIncludePath()}/${plugin.dir.name}/**"
                    exclude "**/docs/**"
                }
                compileClasspath += configurations.microbotRuntime
                runtimeClasspath += configurations.microbotRuntime
            }
        }
    }

    // Common dependency configuration
    configurePluginDependencies = { plugin ->
        def pluginConfigName = "${plugin.name}ShadowDeps"
        configurations.create(pluginConfigName) {
            extendsFrom configurations.pluginShadowClasspath
        }

        def depsFile = new File(project.rootDir,
            "${project.ext.getPluginsResourcePath()}/${plugin.dir.name}/dependencies.txt")

        logger.info("📁 Checking dependencies for ${plugin.name}")

        if (depsFile.exists()) {
            logger.info("   File size: ${depsFile.length()} bytes")
            def lines = depsFile.readLines()
            logger.info("   Lines found: ${lines.size()}")

            lines.each { dep ->
                if (dep.trim()) {
                    logger.info("Adding dependency: ${dep.trim()}")
                    dependencies.add(pluginConfigName, dep.trim())
                }
            }
        }

        return pluginConfigName
    }

    // Common JAR exclusions
    getCommonJarExclusions = {
        return [
                'module-info.class',
                'META-INF/versions/**',
                'META-INF/INDEX.LIST',
                'META-INF/*.SF',
                'META-INF/*.DSA',
                'META-INF/*.RSA',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*',
                'META-INF/MANIFEST.MF',
                'META-INF/native-image/**',
                'META-INF/services/java.**',
                'META-INF/services/javax.**',
                'META-INF/services/sun.**',
                'META-INF/services/com.sun.**',
                '**/.gitkeep',
                '**/.DS_Store',
                '**/Thumbs.db',
                '**/module-info.class',
                '**/plugins.json',
                '**/docs/**',
                '**/dependencies.txt',
                '**/shared-sources.txt',
        ]
    }

    // SHA256 computation utility
    computeSHA256 = { File file ->
        if (!file.exists()) {
            logger.warn("⚠️ JAR file not found: ${file.absolutePath}")
            return "FILE_NOT_FOUND"
        }

        MessageDigest digest = MessageDigest.getInstance("SHA-256")
        file.withInputStream { inputStream ->
            byte[] buffer = new byte[8192]
            int bytesRead
            while ((bytesRead = inputStream.read(buffer)) != -1) {
                digest.update(buffer, 0, bytesRead)
            }
        }

        byte[] hash = digest.digest()
        StringBuilder hexString = new StringBuilder()
        for (byte b : hash) {
            String hex = Integer.toHexString(0xff & b)
            if (hex.length() == 1) {
                hexString.append('0')
            }
            hexString.append(hex)
        }
        return hexString.toString()
    }

    stripJavaComments = { String content ->
        def out = new StringBuilder()
        int i = 0
        while (i < content.length()) {
            char c = content.charAt(i)
            if (content.startsWith('//', i)) {
                int end = content.indexOf('\n', i)
                i = end < 0 ? content.length() : end
            } else if (content.startsWith('/*', i)) {
                int end = content.indexOf('*/', i + 2)
                i = end < 0 ? content.length() : end + 2
                out.append(' ')
            } else if (c == '"' as char || c == '\'' as char) {
                int literalStart = i++
                while (i < content.length() && content.charAt(i) != c) {
                    i += content.charAt(i) == '\\' as char ? 2 : 1
                }
                i = Math.min(i + 1, content.length())
                out.append(content, literalStart, i)
            } else {
                out.append(c)
                i++
            }
        }
        out.toString()
    }

    getPluginDescriptorAttributes = { String content, File javaFile ->
        def source = project.ext.stripJavaComments(content)
        def start = source =~ /@(?:[\w$]+\.)*PluginDescriptor\s*\(/
        if (!start.find()) {
            throw new GradleException("No @PluginDescriptor annotation found in: ${javaFile.absolutePath}")
        }
        def attributes = [:]
        def current = new StringBuilder()
        def flush = {
            def attribute = current.toString().trim()
            current.setLength(0)
            def separator = attribute.indexOf('=')
            if (separator > 0) {
                attributes[attribute.substring(0, separator).trim()] = attribute.substring(separator + 1).trim()
            }
        }
        int depth = 0
        int i = start.end()
        while (i < source.length()) {
            char c = source.charAt(i)
            if (c == '"' as char || c == '\'' as char) {
                int literalStart = i++
                while (i < source.length() && source.charAt(i) != c) {
                    i += source.charAt(i) == '\\' as char ? 2 : 1
                }
                i = Math.min(i + 1, source.length())
                current.append(source, literalStart, i)
                continue
            }
            if (c == '(' as char || c == '{' as char) {
                depth++
            } else if (c == ')' as char || c == '}' as char) {
                if (depth == 0) {
                    flush()
                    return attributes
                }
                depth--
            } else if (c == ',' as char && depth == 0) {
                flush()
                i++
                continue
            }
            current.append(c)
            i++
        }
        throw new GradleException("Unterminated @PluginDescriptor annotation in: ${javaFile.absolutePath}")
    }

    findStringConstant = { File sourceFile, String constantName ->
        def source = project.ext.stripJavaComments(sourceFile.getText('UTF-8'))
        def matcher = source =~ /\bString\s+${java.util.regex.Pattern.quote(constantName)}\s*=\s*"([^"\\]*)"\s*;/
        def values = [] as LinkedHashSet
        while (matcher.find()) {
            values << matcher.group(1)
        }
        values
    }

    resolvePluginVersionConstant = { File javaFile, String expression ->
        def segments = expression.split(/\./) as List
        def constantName = segments.last()
        def qualifiers = segments.size() > 1 ? segments[0..-2].reverse() : [javaFile.name - '.java']
        def pluginDir = javaFile.parentFile
        def pluginsRoot = pluginDir.parentFile

        for (qualifier in qualifiers) {
            def candidates = []
            pluginDir.eachFileRecurse(groovy.io.FileType.FILES) { if (it.name == "${qualifier}.java") candidates << it }
            def shared = new File(pluginsRoot, "${qualifier}.java")
            if (shared.isFile()) {
                candidates << shared
            }
            def values = candidates.collectMany { project.ext.findStringConstant(it, constantName) as List }.unique()
            if (values.size() == 1) {
                return values[0]
            }
            if (values.size() > 1) {
                throw new GradleException("Ambiguous plugin version constant '${expression}' ${values} in: ${javaFile.absolutePath}")
            }
        }
        throw new GradleException("Cannot resolve plugin version '${expression}' in: ${javaFile.absolutePath}. " +
                "Use a string literal or a String constant initialised with a string literal in the plugin's sources.")
    }

    resolvePluginVersion = { String content, File javaFile ->
        def expression = project.ext.getPluginDescriptorAttributes(content, javaFile).version
        if (expression == null) {
            throw new GradleException("Missing required 'version' field in plugin descriptor: ${javaFile.absolutePath}")
        }
        def literal = expression =~ /^"([^"\\]+)"$/
        if (literal.matches()) {
            return literal.group(1)
        }
        if (expression ==~ /[A-Za-z_$][\w$]*(?:\.[A-Za-z_$][\w$]*)*/) {
            return project.ext.resolvePluginVersionConstant(javaFile, expression)
        }
        throw new GradleException("Cannot resolve plugin version '${expression}' in: ${javaFile.absolutePath}. " +
                "Use a non-empty string literal or a single String constant.")
    }

    getPluginClassName = { plugin ->
        def packageMatcher = project.ext.stripJavaComments(plugin.javaFile.getText('UTF-8')) =~ /(?m)^\s*package\s+([\w.]+)\s*;/
        packageMatcher.find() ? "${packageMatcher.group(1)}.${plugin.name}".toString() : plugin.name
    }

    // Plugin descriptor parsing utility
    getPluginDescriptorInfo = { File javaFile ->
        def content = javaFile.getText('UTF-8')
        def descriptor = [:]

        def nameMatcher = content =~ /name\s*=\s*(?:[\w$.]+\s*\+\s*)?"([^"]+)"/
        def descMatcher     = content =~ /description\s*=\s*"([^"]+)"/
        def tagsMatcher     = content =~ /tags\s*=\s*\{([^}]+)\}/
        def authorsMatcher   = content =~ /authors\s*=\s*\{\s*((?:"[^"]*"\s*,?\s*)+)\}/
        def singleAuthorMatcher = content =~ /authors\s*=\s*"([^"]+)"/
        def iconUrlMatcher  = content =~ /iconUrl\s*=\s*"([^"]+)"/
        def cardUrlMatcher  = content =~ /cardUrl\s*=\s*"([^"]+)"/
        def minClientVersionMatcher  = content =~ /minClientVersion\s*=\s*"([^"]+)"/
        def disableMatcher  = content =~ /disable\s*=\s*(true|false)/

        // Required fields - throw exceptions if missing
        if (!nameMatcher.find()) {
            throw new GradleException("Missing required 'name' field in plugin descriptor: ${javaFile.absolutePath}")
        }
        descriptor.name = nameMatcher.group(1)

        if (!minClientVersionMatcher.find()) {
            throw new GradleException("Missing required 'minClientVersion' field in plugin descriptor: ${javaFile.absolutePath}")
        }
        descriptor.minClientVersion = minClientVersionMatcher.group(1)

        // Optional fields
        if (authorsMatcher.find()) {
            descriptor.authors = authorsMatcher.group(1).split(',').collect { it.trim().replaceAll('"','') }
        } else if (singleAuthorMatcher.find()) {
            descriptor.authors = [singleAuthorMatcher.group(1)]
        } else {
            descriptor.authors = project.ext.DEFAULT_AUTHORS
        }
        descriptor.description = descMatcher.find() ? descMatcher.group(1) : ''
        descriptor.iconUrl = iconUrlMatcher.find() ? iconUrlMatcher.group(1) : ''
        descriptor.cardUrl = cardUrlMatcher.find() ? cardUrlMatcher.group(1) : ''
        descriptor.version = project.ext.resolvePluginVersion(content, javaFile)
        descriptor.disable = disableMatcher.find() ? Boolean.parseBoolean(disableMatcher.group(1)) : false

        descriptor.tags = tagsMatcher.find() ?
                tagsMatcher.group(1).split(',').collect { it.trim().replaceAll('"','') } :
                []

        descriptor
    }

    computePluginAddedDates = { File pluginsDir ->
        def addedDates = [:]
        try {
            def shallow = ['git', 'rev-parse', '--is-shallow-repository'].execute(null, project.rootDir)
            def shallowOut = new StringBuilder()
            shallow.waitForProcessOutput(shallowOut, new StringBuilder())
            if (shallow.exitValue() != 0 || shallowOut.toString().trim() == 'true') {
                logger.warn("⚠️ Shallow or missing git history; omitting addedAt")
                return addedDates
            }

            def relativeRoot = project.rootDir.toPath().relativize(pluginsDir.toPath()).toString().replace('\\', '/') + '/'
            def log = ['git', 'log', '--first-parent', '--diff-merges=first-parent', '--format=@%ct', '--name-only', '--', relativeRoot]
                    .execute(null, project.rootDir)
            def output = new StringBuilder()
            log.waitForProcessOutput(output, new StringBuilder())
            if (log.exitValue() != 0) {
                logger.warn("⚠️ git log failed; omitting addedAt")
                return [:]
            }

            Long timestamp = null
            output.toString().eachLine { line ->
                if (line.startsWith('@')) {
                    timestamp = line.substring(1) as Long
                } else if (timestamp != null && line.startsWith(relativeRoot)) {
                    def rest = line.substring(relativeRoot.length())
                    def slash = rest.indexOf('/')
                    if (slash > 0) {
                        def dirName = rest.substring(0, slash)
                        def existing = addedDates[dirName]
                        if (existing == null || timestamp < existing) {
                            addedDates[dirName] = timestamp
                        }
                    }
                }
            }
        } catch (Exception e) {
            logger.warn("⚠️ Could not read git history for addedAt: ${e.message}")
            return [:]
        }

        addedDates.collectEntries { name, seconds -> [(name): java.time.Instant.ofEpochSecond(seconds).toString()] }
    }

    // Generate plugins JSON data
    generatePluginsJsonData = { allPlugins, jarOutputDir ->
        def plugins = []
        def addedDates = project.ext.computePluginAddedDates(file(project.ext.getPluginsSourcePath()))

        allPlugins.each { plugin ->
            try {
                def descriptorInfo = getPluginDescriptorInfo(plugin.javaFile)

                logger.info("Parsing ${plugin.name} - (${descriptorInfo.name})")

                def parsed = [:]
                parsed.internalName = plugin.name
                parsed.name = descriptorInfo.name
                parsed.description = descriptorInfo.description
                parsed.tags = descriptorInfo.tags
                parsed.version = descriptorInfo.version
                parsed.minClientVersion = descriptorInfo.minClientVersion
                parsed.authors = descriptorInfo.authors
                parsed.iconUrl = descriptorInfo.iconUrl
                parsed.cardUrl = descriptorInfo.cardUrl
                parsed.disable = descriptorInfo.disable
                if (addedDates[plugin.dir.name]) {
                    parsed.addedAt = addedDates[plugin.dir.name]
                }

                // Add SHA256
                def jarFile = new File(jarOutputDir, "${plugin.name}-${descriptorInfo.version}.jar")
                parsed.sha256 = computeSHA256(jarFile)

                // Add GitHub Releases URL using centralized config
                def releaseBase = project.ext.getGithubPluginsBaseUrl()
                if (releaseBase.endsWith('/')) {
                    releaseBase = releaseBase.substring(0, releaseBase.length() - 1)
                }
                def releaseTag = project.ext.getGithubPluginsReleaseTag()
                if (releaseTag.endsWith('/')) {
                    releaseTag = releaseTag.substring(0, releaseTag.length() - 1)
                }
                def pluginId = plugin.name.toLowerCase()
                parsed.url = "${releaseBase}/${releaseTag}/${pluginId}-${descriptorInfo.version}.jar"

                plugins << parsed
                logger.info("✅ Plugin ${plugin.name} processed successfully")

            } catch (Exception e) {
                throw new GradleException("Error processing ${plugin.name}: ${e.message}", e)
            }
        }

        return plugins
    }

    readPluginHealth = { File healthFile, Collection<String> knownPlugins ->
        if (!healthFile.exists()) {
            return [:]
        }
        def parsed = new groovy.json.JsonSlurper().parse(healthFile)
        if (!(parsed instanceof Map)) {
            throw new GradleException("${healthFile.name} must be a JSON object keyed by plugin internal name")
        }
        def allowedKeys = ['status', 'reason', 'affectedVersions', 'trackingUrl', 'lastVerifiedVersion', 'lastVerifiedClientVersion', 'updatedAt'] as Set
        def statuses = ['ok', 'broken', 'unverified'] as Set
        parsed.each { name, entry ->
            def where = "${healthFile.name} entry '${name}'"
            if (!knownPlugins.contains(name)) {
                throw new GradleException("${where}: unknown plugin internal name")
            }
            if (!(entry instanceof Map)) {
                throw new GradleException("${where}: must be a JSON object")
            }
            def unknownKeys = entry.keySet() - allowedKeys
            if (!unknownKeys.isEmpty()) {
                throw new GradleException("${where}: unknown field(s) ${unknownKeys}")
            }
            if (!statuses.contains(entry.status)) {
                throw new GradleException("${where}: status must be one of ${statuses}")
            }
            entry.findAll { key, value -> key != 'affectedVersions' }.each { key, value ->
                if (!(value instanceof String) || value.trim().isEmpty()) {
                    throw new GradleException("${where}: ${key} must be a non-empty string")
                }
            }
            if (entry.containsKey('affectedVersions')
                    && (!(entry.affectedVersions instanceof List) || entry.affectedVersions.any { !(it instanceof String) || it.trim().isEmpty() })) {
                throw new GradleException("${where}: affectedVersions must be a list of plugin versions or [\"*\"]")
            }
            if (entry.status == 'broken' && (!entry.reason || !entry.affectedVersions)) {
                throw new GradleException("${where}: broken requires reason and affectedVersions")
            }
            if (entry.trackingUrl && !entry.trackingUrl.startsWith('https://')) {
                throw new GradleException("${where}: trackingUrl must be an https URL")
            }
        }
        parsed
    }

    applyPluginHealth = { plugins, File healthFile, Collection<String> knownPlugins ->
        def health = readPluginHealth(healthFile, knownPlugins)
        plugins.each { plugin ->
            if (health[plugin.internalName]) {
                plugin.health = health[plugin.internalName]
            }
        }
        plugins
    }

    // Create shadow JAR task for plugin - returns task configuration closure
    getPluginJarTaskConfig = { plugin, pluginConfigName ->
        return {
            from(sourceSets.main.output) {
                // Get the relative path of the plugin directory within the source tree
                def pluginRelativePath = sourceSets.main.java.srcDirs.find { srcDir ->
                    plugin.dir.absolutePath.startsWith(srcDir.absolutePath)
                }

                if (pluginRelativePath) {
                    def relativePath = pluginRelativePath.toPath().relativize(plugin.dir.toPath()).toString().replace('\\', '/')
                    include "${relativePath}/**"
                    println "Including classes from path: ${relativePath}/**"
                } else {
                    // Fallback: include by plugin name pattern if directory structure doesn't match
                    include "**/${pluginName}/**"
                    include "**/${pluginName}.class"
                    include "**/${pluginName}Plugin.class"
                    println "Using fallback include pattern for plugin: ${pluginName}"
                }

                // Bundle any opt-in shared source packages (shared-sources.txt) into the plugin JAR, so
                // shared framework classes that live outside the plugin dir are present at runtime.
                project.ext.getPluginSharedSources(plugin).each { glob ->
                    include glob
                    println "Bundling shared classes from: ${glob}"
                }
            }


            dependsOn tasks.named("compile${plugin.sourceSetName.capitalize()}Java")

            def version = pluginVersionFromPluginJson(plugin.dir)
            archiveFileName.set("${plugin.name}-${version}.jar")
            archiveBaseName.set(plugin.name)
            archiveVersion.set(version)
            archiveClassifier.set('')
            configurations = [project.configurations.getByName(pluginConfigName)]
            destinationDirectory.set(layout.buildDirectory.dir("libs"))

            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            entryCompression = ZipEntryCompression.DEFLATED
            filteringCharset = 'UTF-8'

            // Centralized reproducible build settings
            preserveFileTimestamps = false
            reproducibleFileOrder = true

            // Override manifest attributes
            manifest {
                attributes(
                        'Implementation-Title': plugin.name,
                        'Implementation-Version': version,
                        'Built-By': 'microbot-build',
                        'Created-By': 'Gradle Shadow Plugin'
                )

                attributes.remove('Build-Jdk-Spec')
                attributes.remove('Built-Jdk')
                attributes.remove('Build-Jdk')
                attributes.remove('Build-Date')
                attributes.remove('Build-Time')
            }

            eachFile { fileCopyDetails ->
                fileCopyDetails.mode = 0644 // rw-r--r--
            }

            getCommonJarExclusions().each { pattern ->
                exclude pattern
            }

            outputs.upToDateWhen { false }
        }
    }

    generateFallbackReadme = { descriptor ->
        def lines = ["# ${descriptor.name}", ""]
        if (descriptor.description) {
            lines += [descriptor.description, ""]
        }
        lines += [
            "| | |",
            "|---|---|",
            "| Version | ${descriptor.version} |",
            "| Works with Microbot | ${descriptor.minClientVersion} or newer |",
            "| Author${descriptor.authors.size() == 1 ? '' : 's'} | ${descriptor.authors.join(', ')} |"
        ]
        if (descriptor.tags) {
            lines << "| Tags | ${descriptor.tags.join(', ')} |"
        }
        lines += [
            "",
            "## How to install",
            "",
            "1. Open the Microbot client and click the Microbot button.",
            "2. Open the Plugin Hub and search for **${descriptor.name}**.",
            "3. Click install. The plugin then appears under Installed, where you can turn it on and open its settings.",
            "",
            "This plugin has no written guide yet. If you use it and want to help other players, open a pull request on the [Microbot Hub repository](https://github.com/chsami/Microbot-Hub) that adds a `docs/README.md` for it.",
            ""
        ]
        lines.join("\n")
    }

    // Documentation processing utilities
    copyPluginDocumentation = { plugin, publicDir ->
        def pluginName = plugin.name
        def pluginDirName = plugin.dir.name

        def docsDir = new File("${project.ext.getPluginsResourcePath()}/${pluginDirName}/docs")
        def assetsSourceDir = new File(docsDir, "assets")

        def readmeFile = docsDir.isDirectory() ? docsDir.listFiles()?.find { file ->
            file.name.toLowerCase() == "readme.md"
        } : null

        def pluginDocsDir = new File(publicDir, pluginName)
        pluginDocsDir.mkdirs()

        if (readmeFile?.exists()) {
            project.copy {
                from readmeFile
                into pluginDocsDir
            }
            logger.info("✅ Copied ${readmeFile.name} for plugin: ${pluginName}")
        } else {
            try {
                new File(pluginDocsDir, "README.md").text = project.ext.generateFallbackReadme(getPluginDescriptorInfo(plugin.javaFile))
                logger.warn("⚠️ No docs/README.md for plugin: ${pluginName}, generated one from its descriptor")
            } catch (Exception e) {
                logger.warn("⚠️ No docs/README.md for plugin: ${pluginName}, and its descriptor could not be read: ${e.message}")
                return false
            }
        }

        if (assetsSourceDir.exists() && assetsSourceDir.isDirectory()) {
            def assetsDestDir = new File(pluginDocsDir, "assets")
            project.copy {
                from assetsSourceDir
                into assetsDestDir
            }
            logger.info("✅ Copied assets for plugin: ${pluginName}")
        } else {
            logger.info("ℹ️ No assets folder found for plugin: ${pluginName}")
        }

        return true
    }
}
